<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantCode Nexus | B2B Lead API</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #7dd3fc; }
        .price { font-size: 28px; font-weight: bold; color: #fff; margin-bottom: 20px; }
        .price span { font-size: 14px; color: #94a3b8; font-weight: normal; }
    </style>
</head>
<body>
    <div class="card">
        <h1>QuantCode Nexus</h1>
        <p>Instant programmatic access to fresh B2B leads.</p>
        <div class="price">$29<span>/month</span></div>
        <form id="subscribe-form">
            <input type="email" id="email" placeholder="Enter your email address" required>
            <button type="submit">Subscribe & Get API Key</button>
        </form>
    </div>

    <script>
        document.getElementById('subscribe-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const button = e.target.querySelector('button');
            button.textContent = "Redirecting to Stripe...";
            button.disabled = true;

            try {
                const response = await fetch(`/create-checkout-session?email=${encodeURIComponent(email)}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    alert('Error creating checkout session.');
                    button.textContent = "Subscribe & Get API Key";
                    button.disabled = false;
                }
            } catch (err) {
                alert('Connection error.');
                button.textContent = "Subscribe & Get API Key";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
