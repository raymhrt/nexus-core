<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuantCode Nexus - B2B Lead Generation API</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        .hero { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #111; }
        p.subtitle { font-size: 1.2rem; color: #666; }
        .card { background: #fafafa; border: 1px solid #e1e1e1; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, select, button { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #0070f3; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0051a2; }
        .dashboard-link { text-align: center; margin-top: 25px; font-size: 15px; }
        .dashboard-link a { color: #0070f3; text-decoration: none; font-weight: bold; }
        .dashboard-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>QuantCode Nexus</h1>
        <p class="subtitle">High-performance B2B lead generation API for modern sales and automation workflows.</p>
    </div>

    <div class="card">
        <h2>Get Started Instantly</h2>
        <p>Enter your email and choose your subscription tier to unlock your automated API key via Stripe.</p>
        
        <div class="form-group">
            <label for="email">Your Email Address:</label>
            <input type="email" id="email" placeholder="you@company.com" required />
        </div>

        <div class="form-group">
            <label for="tier">Select Plan Tier:</label>
            <select id="tier">
                <option value="starter">Starter Tier - $29/mo (50 records/req, 30 req/min)</option>
                <option value="pro">Pro Tier - $99/mo (200 records/req, 120 req/min)</option>
            </select>
        </div>

        <button onclick="startCheckout()">Proceed to Secure Checkout</button>

        <div class="dashboard-link">
            Already a subscriber? <a href="/dashboard">Access your Dashboard &rarr;</a>
        </div>
    </div>

    <script>
        async function startCheckout() {
            const email = document.getElementById('email').value.trim();
            const tier = document.getElementById('tier').value;

            if (!email || !email.includes('@')) {
                alert("Please enter a valid email address.");
                return;
            }

            try {
                const response = await fetch(`/create-checkout-session?email=${encodeURIComponent(email)}&tier=${encodeURIComponent(tier)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (!response.ok) {
                    alert("Error: " + (data.detail || "Could not create checkout session."));
                    return;
                }

                if (data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    alert("Stripe checkout URL not returned.");
                }

            } catch (err) {
                alert("Request failed: " + err.message);
            }
        }
    </script>

</body>
</html>
